name: Build Android APK (پرورش هوش کودک)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install NPM Dependencies
        run: npm ci

      - name: Run Quality & Curriculum Tests
        run: npm test

      - name: Sync Web Assets to Android
        run: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp index.html manifest.webmanifest sw.js privacy.html terms.html android/app/src/main/assets/public/
          cp -r src assets content vendor android/app/src/main/assets/public/
          test -f android/app/src/main/assets/public/index.html
          test -f android/app/src/main/assets/public/content/curriculum.json

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK Deliverable
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/parvaresh-hoosh-v2.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: parvaresh-hoosh-apk
          path: build-output/parvaresh-hoosh-v2.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.0.0-${{ github.run_number }}
          name: "پرورش هوش کودک - نسخه ۲.۰ (ساخت رسمی)"
          body: |
            ## اپلیکیشن پرورش هوش کودک (Parvaresh Hoosh) - نسخه نهایی و کامل
            - ۱۴۲ درس در ۶ حوزه شناختی و مهارتی
            - ۲۴ مرحله مسیر ماجراجویی هوشمند (از آسان به سخت)
            - ۶ بازی بی‌پایان در شهربازی هوش
            - ۵ کاراکتر مسکات متحرک (دانا، برفی، شیری، توتو، فندق)
            - آزمون‌های شناختی ریون، سایه‌شناسی، حافظه سایمون و ترازوی فیزیکی
            - کارنامه تخصصی راداری هوش کودک برای والدین
            - ۱۰۰٪ آفلاین، بدون نیاز به اینترنت و بدون ایموجی
          files: build-output/parvaresh-hoosh-v2.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
