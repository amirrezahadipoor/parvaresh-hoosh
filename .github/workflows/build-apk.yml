name: Build Android APK (پرورش هوش کودک)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install NPM Dependencies
        run: npm ci

      - name: Run Quality & Curriculum Tests
        run: npm test

      - name: Build and Sync Web Assets to Android
        run: |
          npm run android:sync
          test -f android/app/src/main/assets/public/index.html
          test -f android/app/src/main/assets/public/src/core/icons.js
          test -f android/app/src/main/assets/public/content/curriculum.json

      - name: Build Android APK
        id: android-build
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            export ANDROID_KEYSTORE_PATH="$GITHUB_WORKSPACE/android/app/release.keystore"
            (cd android && ./gradlew assembleRelease --stacktrace --no-daemon)
            echo "apk_path=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "build_type=release" >> "$GITHUB_OUTPUT"
          else
            (cd android && ./gradlew assembleDebug --stacktrace --no-daemon)
            echo "apk_path=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "build_type=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare APK Deliverable
        run: |
          mkdir -p build-output
          cp "${{ steps.android-build.outputs.apk_path }}" build-output/parvaresh-hoosh-v2.0.apk
          echo "Build type: ${{ steps.android-build.outputs.build_type }}" > build-output/build-info.txt
          test -s build-output/parvaresh-hoosh-v2.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: parvaresh-hoosh-apk
          path: build-output/parvaresh-hoosh-v2.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.0.0-${{ github.run_number }}
          name: "پرورش هوش کودک - نسخه ۲.۰ (ساخت رسمی)"
          body: |
            ## اپلیکیشن پرورش هوش کودک (Parvaresh Hoosh) - نسخه نهایی و کامل
            - ۱۴۲ درس در ۶ حوزه شناختی و مهارتی
            - ۲۴ مرحله مسیر ماجراجویی هوشمند (از آسان به سخت)
            - ۶ بازی بی‌پایان در شهربازی هوش
            - ۵ کاراکتر مسکات متحرک (دانا، برفی، شیری، توتو، فندق)
            - آزمون‌های شناختی ریون، سایه‌شناسی، حافظه سایمون و ترازوی فیزیکی
            - کارنامه تخصصی راداری هوش کودک برای والدین
            - ۱۰۰٪ آفلاین، بدون نیاز به اینترنت و بدون ایموجی
          files: build-output/parvaresh-hoosh-v2.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
