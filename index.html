<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#FF6B6B">
    <title>خنک آکادمی</title>
    
    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Phaser.js -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    
    <!-- Styles -->
    <link rel="stylesheet" href="src/styles/main.css">
</head>
<body>
    <!-- Root container -->
    <div id="app" role="application" aria-label="خنک آکادمی">
        <!-- Splash screen -->
        <div id="splash-screen" class="screen active">
            <div class="splash-content">
                <div class="logo">
                    <svg width="120" height="120" viewBox="0 0 120 120">
                        <circle cx="60" cy="60" r="56" fill="#FF6B6B"/>
                        <circle cx="60" cy="60" r="50" fill="#FFF8F0"/>
                        <!-- Fox face -->
                        <path d="M30 70 Q30 40 45 30 L40 20 L55 35 Q60 32 60 32 Q60 32 65 35 L80 20 L75 30 Q90 40 90 70 Q90 90 60 95 Q30 90 30 70Z" fill="#E17055"/>
                        <circle cx="45" cy="60" r="5" fill="#2D3436"/>
                        <circle cx="75" cy="60" r="5" fill="#2D3436"/>
                        <circle cx="44" cy="59" r="2" fill="white"/>
                        <circle cx="74" cy="59" r="2" fill="white"/>
                        <ellipse cx="60" cy="70" rx="8" ry="5" fill="#2D3436"/>
                        <!-- Glasses -->
                        <circle cx="45" cy="60" r="10" fill="none" stroke="#6C5CE7" stroke-width="2"/>
                        <circle cx="75" cy="60" r="10" fill="none" stroke="#6C5CE7" stroke-width="2"/>
                        <line x1="55" y1="60" x2="65" y2="60" stroke="#6C5CE7" stroke-width="2"/>
                    </svg>
                </div>
                <h1 class="app-title">خنک آکادمی</h1>
                <p class="app-subtitle">یادگیری با عشق و بازی</p>
                <div class="loading-bar">
                    <div class="loading-progress"></div>
                </div>
            </div>
        </div>
        
        <!-- Home screen -->
        <div id="home-screen" class="screen">
            <header class="main-header">
                <div class="header-left">
                    <button id="profile-btn" class="icon-btn" aria-label="پروفایل">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2D3436" stroke-width="2">
                            <circle cx="12" cy="8" r="4"/>
                            <path d="M4 22c0-4 3.6-8 8-8s8 4 8 8"/>
                        </svg>
                    </button>
                </div>
                <div class="header-center">
                    <span class="header-title">خنک آکادمی</span>
                </div>
                <div class="header-right">
                    <button id="parent-btn" class="icon-btn" aria-label="بخش والدین">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2D3436" stroke-width="2">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        </svg>
                    </button>
                </div>
            </header>
            
            <main class="main-content">
                <!-- Mascot greeting -->
                <div class="mascot-section">
                    <div id="mascot-greeting" class="mascot-box">
                        <span class="mascot-speech">سلام! امروز می‌خوای چی یاد بگیری؟</span>
                    </div>
                </div>
                
                <!-- Domain cards grid -->
                <div class="domains-grid" id="domains-grid">
                    <!-- Populated by JS -->
                </div>
            </main>
            
            <nav class="bottom-nav" role="tablist">
                <button class="nav-item active" data-screen="home" aria-label="خانه">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                    <span>خانه</span>
                </button>
                <button class="nav-item" data-screen="learn" aria-label="یادگیری">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    <span>یادگیری</span>
                </button>
                <button class="nav-item" data-screen="rewards" aria-label="جایزه‌ها">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                    <span>ستاره‌ها</span>
                </button>
                <button class="nav-item" data-screen="games" aria-label="بازی‌ها">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    <span>بازی</span>
                </button>
            </nav>
        </div>
        
        <!-- Game canvas container -->
        <div id="game-container" style="display:none;"></div>
    </div>

    <!-- Scripts -->
    <script src="src/utils/config.js"></script>
    <script src="src/utils/storage.js"></script>
    <script src="src/utils/mascot.js"></script>
    <script src="src/main.js"></script>
</body>
</html>
