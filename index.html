<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#FF6B6B">
    <meta name="description" content="خنک آکادمی - اپلیکیشن آموزشی آفلاین فارسی برای کودکان ۵ تا ۸ سال">
    <title>خنک آکادمی</title>

    <!-- Bundled font (offline) -->
    <style>
        @font-face {
            font-family: 'Vazirmatn';
            src: url('assets/fonts/Vazirmatn-Regular.woff2') format('woff2');
            font-weight: 400; font-display: swap;
        }
        @font-face {
            font-family: 'Vazirmatn';
            src: url('assets/fonts/Vazirmatn-Medium.woff2') format('woff2');
            font-weight: 500; font-display: swap;
        }
        @font-face {
            font-family: 'Vazirmatn';
            src: url('assets/fonts/Vazirmatn-Bold.woff2') format('woff2');
            font-weight: 700; font-display: swap;
        }
        @font-face {
            font-family: 'Vazirmatn';
            src: url('assets/fonts/Vazirmatn-ExtraBold.woff2') format('woff2');
            font-weight: 800; font-display: swap;
        }
        @font-face {
            font-family: 'Vazirmatn';
            src: url('assets/fonts/Vazirmatn-Black.woff2') format('woff2');
            font-weight: 900; font-display: swap;
        }
    </style>

    <link rel="stylesheet" href="src/styles/main.css">
</head>
<body>
    <div id="app">
        <!-- Splash -->
        <div id="screen-splash" class="screen active">
            <div class="splash-content">
                <div class="splash-logo" id="splash-logo"></div>
                <h1 class="app-title">خنک آکادمی</h1>
                <p class="app-subtitle">يادگيري با عشق و بازي</p>
                <div class="loading-bar"><div class="loading-progress"></div></div>
            </div>
        </div>

        <!-- Home -->
        <div id="screen-home" class="screen">
            <header class="main-header">
                <button class="icon-btn" id="btn-parent" aria-label="بخش والدين">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2D3436" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                </button>
                <span class="header-title">خنک آکادمي</span>
                <div style="display:flex;gap:8px">
                <button class="icon-btn" id="btn-stars" aria-label="ستاره‌ها">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="#E1B12C"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                </button>
                <button class="icon-btn" id="btn-voice" aria-label="صدا">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2D3436" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>
                </button>
                </div>
            </header>
            <main class="main-content" id="home-content">
                <div class="mascot-row">
                    <div class="mascot-avatar" id="home-mascot"></div>
                    <div class="speech-bubble" id="home-speech">سلام! امروز چي ياد مي‌گيريم؟</div>
                </div>
                <div class="domains-grid" id="domains-grid"></div>
            </main>
        </div>

        <!-- Domain / Levels -->
        <div id="screen-domain" class="screen">
            <header class="sub-header">
                <button class="icon-btn" id="btn-back-domain" aria-label="بازگشت">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2D3436" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                </button>
                <span class="header-title" id="domain-title">حوزه</span>
                <span class="header-title header-title-muted" id="domain-progress-text"></span>
            </header>
            <main class="main-content" id="domain-content"></main>
        </div>

        <!-- Level lessons -->
        <div id="screen-level" class="screen">
            <header class="sub-header">
                <button class="icon-btn" id="btn-back-level" aria-label="بازگشت">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2D3436" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                </button>
                <span class="header-title" id="level-title">سطح</span>
            </header>
            <main class="main-content" id="level-content"></main>
        </div>

        <!-- Lesson / Activity player -->
        <div id="screen-lesson" class="screen">
            <header class="sub-header lesson-header">
                <button class="icon-btn" id="btn-exit-lesson" aria-label="خروج">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2D3436" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
                <div class="lesson-progress-wrap">
                    <div class="lesson-progress-bar"><div class="lesson-progress-fill" id="lesson-progress-fill"></div></div>
                    <span class="lesson-progress-text" id="lesson-progress-text">1 / 5</span>
                </div>
                <div class="star-counter" id="star-counter">★ 0</div>
            </header>
            <main class="lesson-body" id="lesson-body">
                <!-- Activity content rendered here -->
            </main>
        </div>

        <!-- Rewards / Achievements -->
        <div id="screen-rewards" class="screen">
            <header class="sub-header">
                <button class="icon-btn" id="btn-back-rewards" aria-label="بازگشت">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2D3436" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                </button>
                <span class="header-title">ستاره‌هاي من</span>
            </header>
            <main class="main-content" id="rewards-content"></main>
        </div>

        <!-- Parent dashboard -->
        <div id="screen-parents" class="screen">
            <header class="sub-header">
                <button class="icon-btn" id="btn-back-parents" aria-label="بازگشت">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2D3436" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                </button>
                <span class="header-title">بخش والدين</span>
            </header>
            <main class="main-content" id="parents-content"></main>
        </div>
    </div>

    <!-- Vendors (bundled offline) -->
    <script src="vendor/phaser.min.js"></script>
    <script src="vendor/gsap.min.js"></script>

    <!-- Data -->
    <script src="src/data/alphabet.js"></script>
    <script src="src/data/words.js"></script>
    <script src="src/data/math-data.js"></script>
    <script src="src/data/world-data.js"></script>

    <!-- Core -->
    <script src="src/core/config.js"></script>
    <script src="src/core/audio.js"></script>
    <script src="src/core/storage.js"></script>
    <script src="src/core/adaptive.js"></script>
    <script src="src/core/mascot.js"></script>
    <script src="src/core/svg-art.js"></script>
    <script src="src/core/fx.js"></script>
    <script src="src/core/nav.js"></script>

    <!-- Activities -->
    <script src="src/activities/generator.js"></script>
    <script src="src/activities/quiz.js"></script>
    <script src="src/activities/memory.js"></script>
    <script src="src/activities/dragdrop.js"></script>
    <script src="src/activities/tracing.js"></script>
    <script src="src/activities/ordering.js"></script>
    <script src="src/activities/painting.js"></script>

    <!-- App -->
    <script src="src/main.js"></script>
</body>
</html>
